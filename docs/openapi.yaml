openapi: 3.0.3
info:
  title: ShoppyGlobe API
  description: |
    Backend API for the ShoppyGlobe e-commerce app.

    - Public routes: health, products, auth (register/login).
    - Protected routes (require a Bearer JWT): `GET /auth/me` and the cart endpoints.
    - Click the green **Authorize** button and paste a token returned by `POST /auth/login`.

    Success responses follow `{ success: true, data }` (some also include `message`/`count`).
    Errors follow `{ success: false, message }`.
  version: 1.0.0
  contact:
    name: ShoppyGlobe
servers:
  - url: http://localhost:3000/api
    description: Local development server
tags:
  - name: Health
    description: Server health check
  - name: Products
    description: Public product catalog
  - name: Auth
    description: User registration, login and profile
  - name: Cart
    description: JWT-protected shopping cart
paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Returns whether the server is running.
      operationId: getHealth
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Server is running
  /products:
    get:
      tags:
        - Products
      summary: List products
      description: |
        Fetch a list of products. Optional `search` filters by name
        (case-insensitive substring) and `limit` caps the result count
        (default 50, max 100).
      operationId: listProducts
      parameters:
        - name: search
          in: query
          required: false
          description: Filter products by name (case-insensitive substring).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of results to return.
          schema:
            type: integer
            minimum: 1
            default: 50
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - count
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 2
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Product"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /products/{id}:
    get:
      tags:
        - Products
      summary: Get a product by id
      description: Fetch a single product by its MongoDB ObjectId.
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          description: MongoDB ObjectId of the product.
          schema:
            type: string
            example: 64f1c2d5e8a1b2c3d4e5f6a7
      responses:
        "200":
          description: The requested product
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User registered successfully
                  data:
                    $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in and get a JWT
      description: |
        Authenticates a user and returns a JWT. Use the returned token with the
        **Authorize** button to access the protected routes.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Login successful
                  data:
                    type: object
                    required:
                      - token
                      - user
                    properties:
                      token:
                        type: string
                        description: JWT for authenticating protected routes.
                        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                      user:
                        $ref: "#/components/schemas/PublicUser"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/me:
    get:
      tags:
        - Auth
      summary: Get the authenticated user's profile
      description: Requires a valid Bearer JWT.
      security:
        - bearerAuth: []
      operationId: getMe
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/PublicUser"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /cart:
    get:
      tags:
        - Cart
      summary: Get the current user's cart
      description: |
        Fetches the authenticated user's cart. Returns 404 if no cart exists yet.
      security:
        - bearerAuth: []
      operationId: getCart
      responses:
        "200":
          description: The user's cart
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: "#/components/schemas/Cart"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags:
        - Cart
      summary: Add a product to the cart
      description: |
        Adds a product to the authenticated user's cart. If the product is
        already in the cart, the quantity is incremented.
      security:
        - bearerAuth: []
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemRequest"
      responses:
        "200":
          description: Product added to cart
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product added to cart
                  data:
                    $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /cart/{productId}:
    put:
      tags:
        - Cart
      summary: Update the quantity of a cart item
      description: Sets the quantity of a product in the authenticated user's cart.
      security:
        - bearerAuth: []
      operationId: updateCartItem
      parameters:
        - name: productId
          in: path
          required: true
          description: MongoDB ObjectId of the product.
          schema:
            type: string
            example: 64f1c2d5e8a1b2c3d4e5f6a7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - quantity
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  description: New quantity for the cart item.
                  example: 5
      responses:
        "200":
          description: Cart updated
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Cart updated
                  data:
                    $ref: "#/components/schemas/Cart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Cart
      summary: Remove a product from the cart
      security:
        - bearerAuth: []
      operationId: removeCartItem
      parameters:
        - name: productId
          in: path
          required: true
          description: MongoDB ObjectId of the product.
          schema:
            type: string
            example: 64f1c2d5e8a1b2c3d4e5f6a7
      responses:
        "200":
          description: Product removed from cart
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Product removed from cart
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Paste the token returned by `POST /auth/login`.
  schemas:
    Product:
      type: object
      required:
        - _id
        - name
        - price
        - description
        - stock
        - category
      properties:
        _id:
          type: string
          example: 64f1c2d5e8a1b2c3d4e5f6a7
        name:
          type: string
          example: Wireless Headphones
        price:
          type: number
          example: 2499
        description:
          type: string
          example: Over-ear Bluetooth headphones with ANC.
        stock:
          type: integer
          example: 15
        category:
          type: string
          example: Electronics
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PublicUser:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          example: 64f1c2d5e8a1b2c3d4e5f6a7
        name:
          type: string
          example: Alice
        email:
          type: string
          format: email
          example: alice@example.com
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 1
          example: Alice
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          minLength: 6
          description: Minimum 6 characters.
          example: secret123
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          example: secret123
    CartItem:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          example: 64f1c2d5e8a1b2c3d4e5f6a7
        quantity:
          type: integer
          minimum: 1
          example: 2
    CartItemRequest:
      type: object
      required:
        - productId
        - quantity
      properties:
        productId:
          type: string
          description: MongoDB ObjectId of the product to add.
          example: 64f1c2d5e8a1b2c3d4e5f6a7
        quantity:
          type: integer
          minimum: 1
          description: Quantity to add (increments existing quantity).
          example: 2
    Cart:
      type: object
      required:
        - _id
        - userId
        - items
      properties:
        _id:
          type: string
          example: 64f1c2d5e8a1b2c3d4e5f6a7
        userId:
          type: string
          example: 64f1c2d5e8a1b2c3d4e5f6a7
        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItem"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Product not found
  responses:
    BadRequest:
      description: Bad request / validation failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Duplicate email
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
